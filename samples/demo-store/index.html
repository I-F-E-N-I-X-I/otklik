<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Отклик · Demo Store</title><style>body{font:16px system-ui;background:#f2f5f8;color:#172438;max-width:1000px;margin:50px auto;padding:20px}h1{font-size:42px}input,select,button{font:inherit;padding:12px;border:1px solid #ccd5df;border-radius:8px}button{background:#087e83;color:white;cursor:pointer}section{display:flex;gap:20px;flex-wrap:wrap;margin-top:30px}article{background:white;padding:24px;border-radius:16px;min-width:220px}#state{padding:20px 0}label{display:block;margin:12px 0}</style><h1>Demo Store</h1><p>Реальный fetch к локальному серверу Отклик. Запустите демопроект и включите CORS.</p><label>Base URL <input id="base" value="http://127.0.0.1:3001"></label><label>Маршрут <input id="path" value="/api/products"><select id="filter"><option value="">Все товары</option><option value="books">Книги</option></select></label><button id="load">Загрузить / повторить</button><button id="scenario">Сценарий 500 → 503 → 200</button><div id="state" role="status"></div><section id="items"></section><script>
const base=document.querySelector('#base'),path=document.querySelector('#path'),filter=document.querySelector('#filter'),state=document.querySelector('#state'),items=document.querySelector('#items'),scenario=document.querySelector('#scenario');let active=0;async function load(){const id=++active;state.textContent='Загрузка…';items.replaceChildren();try{let url=base.value.replace(/\/$/,'')+path.value;if(filter.value)url+='?category='+encodeURIComponent(filter.value);const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status+' — нажмите «Загрузить / повторить»');const data=await response.json();if(id!==active)return;if(!Array.isArray(data))throw Error('Ожидается JSON-массив товаров');state.textContent=data.length?'Получено товаров: '+data.length:'Список пуст';for(const product of data){const card=document.createElement('article'),title=document.createElement('h2'),price=document.createElement('p');title.textContent=product.name;price.textContent=product.price+' ₽';card.append(title,price);items.append(card)}}catch(error){if(id===active)state.textContent='Ошибка: '+error.message}}document.querySelector('#load').onclick=load;scenario.onclick=()=>{path.value='/api/retry';filter.value='';load()};</script></html>
