name: Build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MockLab.slnx
      - name: Build Release
        run: dotnet build MockLab.slnx -c Release --no-restore
      - name: Run 49 checks
        run: dotnet run --project tests/MockLab.Tests -c Release --no-build
